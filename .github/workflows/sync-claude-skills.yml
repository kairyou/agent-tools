name: Sync Claude skill upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Optional Claude Code version
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-claude-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check for an existing manual-review PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --head automation/claude-skill-sync --state open --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Fetch pending upstream
        if: steps.existing.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          npm run claude-skills:fetch -- "${args[@]}"

      - name: Render and verify final candidate
        id: candidate
        if: steps.existing.outputs.count == '0'
        run: |
          if [ ! -f tools/claude-skill-sync/upstream/pending.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat tools/claude-skill-sync/upstream/pending-report.md >> "$GITHUB_STEP_SUMMARY"
          npm run claude-skills:apply -- --write
          npm run claude-skills:check
          npm run build
          npm test
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create draft review PR
        if: steps.candidate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/claude-skill-sync
          delete-branch: true
          draft: true
          commit-message: "chore: sync latest Claude Code skill prompts"
          title: "chore: sync latest Claude Code skill prompts"
          body: |
            This draft PR contains the final generated candidate for the latest mirrored Claude Code prompts.

            Review:

            - `tools/claude-skill-sync/upstream/current.json` for source provenance and the accepted baseline.
            - Generated changes to `skills/workflow/at-review/SKILL.md` and `skills/workflow/at-simplify/SKILL.md`.
            - Monitored host-specific prompt changes in the workflow run summary; they are intentionally excluded from the portable skills.

            The workflow ran `claude-skills:check`, `npm run build`, and `npm test` before opening this PR. If neither skill changed, merging only advances the reviewed upstream baseline. Merge remains the manual acceptance step; publishing remains separate.
